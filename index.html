<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VidEid - Professional Video Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #6a1b9a, #9c27b0);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
            text-align: center;
            padding: 20px;
        }

        .logo {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 4px;
            animation: fadeInUp 0.8s ease;
        }

        .credit {
            margin-top: 1rem;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .version {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 0.5rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main App */
        #app {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #fff, #ce93d8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 16px;
        }

        button, .file-label {
            background: #2c2c2c;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            font-weight: 500;
        }

        button:hover, .file-label:hover {
            background: #9c27b0;
            transform: scale(1.02);
        }

        .primary-btn {
            background: #9c27b0;
            box-shadow: 0 2px 8px rgba(156,39,176,0.3);
        }

        .timeline {
            background: #111;
            border-radius: 20px;
            padding: 16px;
            margin: 20px 0;
            min-height: 180px;
        }

        .clip-item {
            background: #222;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview {
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            margin: 20px auto;
            aspect-ratio: 16/9;
            max-width: 800px;
            width: 100%;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .controls-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .card {
            background: #151515;
            border-radius: 20px;
            padding: 16px;
        }

        input[type="range"] {
            width: 100%;
            margin: 8px 0;
        }

        .filter-buttons, .ratio-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        progress {
            width: 100%;
            height: 6px;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: #777;
        }

        .error-msg {
            background: #d32f2f;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .toolbar { justify-content: center; }
            h1 { font-size: 1.3rem; }
        }
    </style>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8.0.0/build/umd.js"></script>
</head>
<body>

<div id="splash">
    <div class="logo">🎬 VidEid</div>
    <div class="credit">MD Milon Hossain</div>
    <div class="version">Version 1.0.0</div>
    <div style="margin-top: 40px; font-size: 0.9rem;" id="loadingMsg">Loading Editor...</div>
</div>

<div id="app">
    <header>
        <h1>🎥 VidEid · Offline Editor</h1>
        <div>
            <span id="projectName" style="background:#333; padding:4px 12px; border-radius:20px;">Untitled</span>
        </div>
    </header>

    <div class="toolbar">
        <input type="file" id="videoInput" accept="video/*,image/*" multiple style="display:none" />
        <button id="addMediaBtn">➕ Add Video/Photo</button>
        <button id="saveProjectBtn">💾 Save Project</button>
        <button id="loadProjectBtn">📂 Load Project</button>
        <button id="exportBtn" class="primary-btn">✨ EXPORT HD VIDEO</button>
    </div>

    <div class="timeline" id="timelineContainer">
        <div style="margin-bottom: 12px; font-weight: bold;">📋 Timeline (clips in order)</div>
        <div id="clipsList"></div>
        <button id="mergeClipsBtn" style="margin-top: 10px;">🔗 Merge & Preview</button>
    </div>

    <div class="preview">
        <video id="previewPlayer" controls></video>
    </div>

    <div class="controls-panel">
        <div class="card">
            <h3>✂️ Trim / Split</h3>
            <p style="font-size:0.8rem;">Select a clip, then set cut points</p>
            <select id="clipSelector"></select>
            <label>Start (sec): <input type="number" id="trimStart" step="0.5" value="0"></label>
            <label>End (sec): <input type="number" id="trimEnd" step="0.5" value="10"></label>
            <button id="applyTrimBtn">✂️ Trim Selected</button>
            <button id="splitClipBtn">🔪 Split at current time</button>
        </div>

        <div class="card">
            <h3>🎵 Audio</h3>
            <label>Volume: <input type="range" id="volumeSlider" min="0" max="2" step="0.01" value="1"></label>
            <input type="file" id="musicInput" accept="audio/*" style="margin:8px 0; display:block">
            <button id="addMusicBtn">🎧 Add Background Music</button>
            <button id="removeAudioBtn">🔇 Remove Original Audio</button>
        </div>

        <div class="card">
            <h3>🎨 Filters</h3>
            <div class="filter-buttons">
                <button data-filter="none">Normal</button>
                <button data-filter="brightness=0.2">Bright+</button>
                <button data-filter="contrast=1.5">High Contrast</button>
                <button data-filter="hue=H=60">Warm</button>
                <button data-filter="colorchannelmixer=.393:.769:.189:0:.349:.686:.168:0:.272:.534:.131">Sepia</button>
                <button data-filter="curves=preset=film_stock">Film</button>
            </div>
        </div>

        <div class="card">
            <h3>📐 Aspect Ratio</h3>
            <div class="ratio-buttons">
                <button data-ratio="original">Original</button>
                <button data-ratio="1:1">1:1</button>
                <button data-ratio="16:9">16:9 (HD)</button>
                <button data-ratio="9:16">9:16 (Vertical)</button>
                <button data-ratio="4:3">4:3</button>
            </div>
        </div>
    </div>
    <progress id="exportProgress" value="0" max="100" style="display:none"></progress>
    <footer>
        VidEid 1.0.0 | MD Milon Hossain | Fully offline · Powered by FFmpeg.wasm
    </footer>
</div>

<script>
    // ------------------------- GLOBALS -------------------------
    let ffmpeg;
    let loaded = false;
    let projectClips = []; // each: { name, file: File, type, duration, url, trimmedStart?, trimmedEnd? }
    let currentFilter = "none";
    let currentAspect = "original";
    let volume = 1.0;
    let bgMusicFile = null;
    let removeOriginalAudio = false;
    let mergedBlob = null;
    let db;

    // DOM elements
    const splash = document.getElementById('splash');
    const appDiv = document.getElementById('app');
    const loadingMsg = document.getElementById('loadingMsg');
    const clipsListDiv = document.getElementById('clipsList');
    const previewPlayer = document.getElementById('previewPlayer');
    const clipSelector = document.getElementById('clipSelector');
    const exportProgress = document.getElementById('exportProgress');

    // ------------------------- SERVICE WORKER (for COOP/COEP headers) -------------------------
    async function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
            try {
                // Create a simple service worker that adds required headers
                const swCode = `self.addEventListener('fetch', event => {
                    event.respondWith(fetch(event.request).then(response => {
                        const newHeaders = new Headers(response.headers);
                        newHeaders.set('Cross-Origin-Opener-Policy', 'same-origin');
                        newHeaders.set('Cross-Origin-Embedder-Policy', 'require-corp');
                        return new Response(response.body, {
                            status: response.status,
                            statusText: response.statusText,
                            headers: newHeaders
                        });
                    }));
                });`;
                const blob = new Blob([swCode], {type: 'application/javascript'});
                const swUrl = URL.createObjectURL(blob);
                await navigator.serviceWorker.register(swUrl);
                console.log('Service Worker registered (COOP/COEP enabled)');
                URL.revokeObjectURL(swUrl);
            } catch (err) {
                console.warn('Service Worker registration failed', err);
            }
        }
    }

    // ------------------------- INIT FFMPEG -------------------------
    async function init() {
        await registerServiceWorker(); // try to fix headers
        try {
            loadingMsg.innerText = 'Loading FFmpeg engine (25MB)...';
            ffmpeg = new FFmpeg();
            await ffmpeg.load({
                coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
                wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
            });
            loaded = true;
            loadingMsg.innerText = 'Initializing storage...';
            db = await idb.openDB('VidEidDB', 1, {
                upgrade(db) {
                    db.createObjectStore('projects');
                }
            });
            loadingMsg.innerText = 'Ready! Opening editor...';
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    appDiv.style.display = 'block';
                }, 500);
            }, 800);
        } catch (err) {
            console.error(err);
            loadingMsg.innerHTML = `⚠️ FFmpeg failed to load.<br><br>
            This app requires special browser security headers.<br><br>
            ✅ To run locally: <code>npx http-server --coop --coep</code><br>
            ✅ Or deploy on <strong>Vercel</strong> (free, works instantly).<br><br>
            If you're on GitHub Pages, try reloading the page twice.`;
            loadingMsg.style.background = '#b71c1c';
            loadingMsg.style.padding = '15px';
            loadingMsg.style.borderRadius = '12px';
            loadingMsg.style.fontSize = '0.9rem';
        }
    }

    // ------------------------- UI HELPERS -------------------------
    function updateTimelineUI() {
        clipsListDiv.innerHTML = '';
        if (projectClips.length === 0) {
            clipsListDiv.innerHTML = '<div style="color:#888;">No clips. Click "Add Video/Photo"</div>';
            clipSelector.innerHTML = '<option>No clips</option>';
            return;
        }
        projectClips.forEach((clip, idx) => {
            const div = document.createElement('div');
            div.className = 'clip-item';
            div.innerHTML = `
                <span><strong>${clip.name}</strong> (${clip.type}) ${clip.trimmedStart !== undefined ? `✂️ ${clip.trimmedStart.toFixed(1)}s-${clip.trimmedEnd.toFixed(1)}s` : ''}</span>
                <button data-idx="${idx}" class="removeClipBtn">🗑️</button>
            `;
            clipsListDiv.appendChild(div);
        });
        clipSelector.innerHTML = projectClips.map((c, i) => `<option value="${i}">${c.name}</option>`).join('');
        document.querySelectorAll('.removeClipBtn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                projectClips.splice(idx, 1);
                updateTimelineUI();
            });
        });
    }

    function addFile(file) {
        if (!file.type.startsWith('video/') && !file.type.startsWith('image/')) return;
        const url = URL.createObjectURL(file);
        const newClip = {
            name: file.name,
            file: file,
            type: file.type.startsWith('video/') ? 'video' : 'image',
            duration: 3, // default for images
            url: url,
            trimmedStart: undefined,
            trimmedEnd: undefined,
        };
        projectClips.push(newClip);
        updateTimelineUI();

        if (file.type.startsWith('video/')) {
            const vid = document.createElement('video');
            vid.preload = 'metadata';
            vid.onloadedmetadata = () => {
                newClip.duration = vid.duration;
                if (newClip.trimmedStart === undefined) newClip.trimmedStart = 0;
                if (newClip.trimmedEnd === undefined) newClip.trimmedEnd = newClip.duration;
                updateTimelineUI();
            };
            vid.src = url;
        }
    }

    // ------------------------- FFMPEG OPERATIONS -------------------------
    async function mergeAndPreview() {
        if (!loaded || projectClips.length === 0) {
            alert("Wait for FFmpeg to load or add clips.");
            return;
        }
        exportProgress.style.display = 'block';
        exportProgress.value = 0;

        try {
            // Clean previous files
            for (let i = 0; i < 20; i++) {
                try { ffmpeg.FS('unlink', `/conv${i}.mp4`); } catch(e) {}
            }
            for (let i = 0; i < projectClips.length; i++) {
                const clip = projectClips[i];
                let fileData = new Uint8Array(await clip.file.arrayBuffer());
                let ext = clip.type === 'video' ? '.mp4' : '.png';
                let filename = `/clip${i}${ext}`;
                ffmpeg.FS('writeFile', filename, fileData);
                if (clip.type === 'image') {
                    await ffmpeg.run('-loop', '1', '-i', filename, '-t', `${clip.duration}`, '-c:v', 'libx264', '-pix_fmt', 'yuv420p', `/img_vid${i}.mp4`);
                    ffmpeg.FS('unlink', filename);
                    ffmpeg.FS('rename', `/img_vid${i}.mp4`, `/conv${i}.mp4`);
                } else {
                    ffmpeg.FS('rename', filename, `/conv${i}.mp4`);
                }
                exportProgress.value = (i / projectClips.length) * 30;
            }

            // Create concat list
            let concatContent = '';
            for (let i = 0; i < projectClips.length; i++) {
                concatContent += `file '/conv${i}.mp4'\n`;
            }
            ffmpeg.FS('writeFile', 'list.txt', new TextEncoder().encode(concatContent));
            await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'merged_raw.mp4');
            exportProgress.value = 50;

            // Apply filters, aspect, audio
            let filterChain = [];
            if (currentFilter !== 'none') filterChain.push(currentFilter);
            if (currentAspect !== 'original') {
                let scaleFilter = '';
                if (currentAspect === '1:1') scaleFilter = 'scale=1080:1080:force_original_aspect_ratio=1,pad=1080:1080:(ow-iw)/2:(oh-ih)/2';
                if (currentAspect === '16:9') scaleFilter = 'scale=1920:1080:force_original_aspect_ratio=1,pad=1920:1080:(ow-iw)/2:(oh-ih)/2';
                if (currentAspect === '9:16') scaleFilter = 'scale=1080:1920:force_original_aspect_ratio=1,pad=1080:1920:(ow-iw)/2:(oh-ih)/2';
                if (currentAspect === '4:3') scaleFilter = 'scale=1440:1080:force_original_aspect_ratio=1,pad=1440:1080:(ow-iw)/2:(oh-ih)/2';
                filterChain.push(scaleFilter);
            }
            let vf = filterChain.join(',');
            let cmdArgs = ['-i', 'merged_raw.mp4'];
            if (bgMusicFile) {
                const musicData = new Uint8Array(await bgMusicFile.arrayBuffer());
                ffmpeg.FS('writeFile', 'bg.mp3', musicData);
                cmdArgs.push('-i', 'bg.mp3');
                let complex = removeOriginalAudio ?
                    `[1:a]volume=0.8[a1]` :
                    `[0:a]volume=${volume}[a0];[1:a]volume=0.8[a1];[a0][a1]amix=inputs=2:duration=longest`;
                cmdArgs.push('-filter_complex', complex);
                cmdArgs.push('-map', '0:v');
                cmdArgs.push('-map', removeOriginalAudio ? '[a1]' : '[a]');
            } else {
                if (removeOriginalAudio) cmdArgs.push('-an');
                else cmdArgs.push('-af', `volume=${volume}`);
            }
            if (vf.length) cmdArgs.push('-vf', vf);
            cmdArgs.push('-c:v', 'libx264', '-preset', 'fast', '-crf', '23', '-c:a', 'aac', '-b:a', '128k', '-y', 'final_preview.mp4');

            await ffmpeg.run(...cmdArgs);
            const data = ffmpeg.FS('readFile', 'final_preview.mp4');
            mergedBlob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(mergedBlob);
            previewPlayer.src = url;
            previewPlayer.play();
            exportProgress.style.display = 'none';
        } catch (err) {
            console.error(err);
            alert("Merge failed: " + err.message);
            exportProgress.style.display = 'none';
        }
    }

    async function exportHD() {
        if (!mergedBlob) {
            alert("Please click 'Merge & Preview' first");
            return;
        }
        const url = URL.createObjectURL(mergedBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `VidEid_${Date.now()}.mp4`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    async function saveProject() {
        const proj = {
            clips: await Promise.all(projectClips.map(async c => ({
                name: c.name,
                type: c.type,
                data: await c.file.arrayBuffer(),
                trimmedStart: c.trimmedStart,
                trimmedEnd: c.trimmedEnd,
                duration: c.duration,
            }))),
            filter: currentFilter,
            aspect: currentAspect,
            volume,
            bgMusic: bgMusicFile ? await bgMusicFile.arrayBuffer() : null,
            removeAudio: removeOriginalAudio,
        };
        const id = 'project_' + Date.now();
        await db.put('projects', proj, id);
        alert(`Project saved with ID: ${id}`);
    }

    async function loadProject() {
        const keys = await db.getAllKeys('projects');
        if (!keys.length) { alert('No saved projects'); return; }
        const id = prompt('Enter project ID (last saved):', keys[keys.length-1]);
        if (!id) return;
        const proj = await db.get('projects', id);
        if (!proj) { alert('Not found'); return; }
        projectClips = [];
        for (let clip of proj.clips) {
            const file = new File([clip.data], clip.name, { type: clip.type === 'video' ? 'video/mp4' : 'image/png' });
            const url = URL.createObjectURL(file);
            projectClips.push({
                name: clip.name,
                file: file,
                type: clip.type,
                duration: clip.duration,
                url: url,
                trimmedStart: clip.trimmedStart,
                trimmedEnd: clip.trimmedEnd,
            });
        }
        currentFilter = proj.filter;
        currentAspect = proj.aspect;
        volume = proj.volume;
        removeOriginalAudio = proj.removeAudio;
        if (proj.bgMusic) {
            bgMusicFile = new File([proj.bgMusic], 'bg_music.mp3', { type: 'audio/mpeg' });
        }
        updateTimelineUI();
        alert('Project loaded. Click Merge & Preview to see result');
    }

    function applyTrim() {
        const idx = parseInt(clipSelector.value);
        if (isNaN(idx) || !projectClips[idx]) return;
        const clip = projectClips[idx];
        const start = parseFloat(document.getElementById('trimStart').value);
        let end = parseFloat(document.getElementById('trimEnd').value);
        if (start >= end) { alert('Invalid trim range'); return; }
        clip.trimmedStart = start;
        clip.trimmedEnd = Math.min(end, clip.duration);
        updateTimelineUI();
        alert('Trim applied (will take effect after Merge)');
    }

    function splitClip() {
        const idx = parseInt(clipSelector.value);
        if (isNaN(idx) || !projectClips[idx]) return;
        const clip = projectClips[idx];
        const currentTime = previewPlayer.currentTime;
        if (!currentTime || currentTime <= 0) { alert('Seek video to split point'); return; }
        const startA = clip.trimmedStart !== undefined ? clip.trimmedStart : 0;
        const endA = currentTime;
        const startB = currentTime;
        const endB = clip.trimmedEnd !== undefined ? clip.trimmedEnd : clip.duration;
        const newClipA = { ...clip, trimmedStart: startA, trimmedEnd: endA };
        const newClipB = { ...clip, trimmedStart: startB, trimmedEnd: endB };
        projectClips.splice(idx, 1, newClipA, newClipB);
        updateTimelineUI();
        alert('Clip split! Merge to see result');
    }

    // ------------------------- EVENT LISTENERS -------------------------
    document.getElementById('addMediaBtn').onclick = () => document.getElementById('videoInput').click();
    document.getElementById('videoInput').onchange = (e) => {
        for (let file of e.target.files) addFile(file);
        e.target.value = '';
    };
    document.getElementById('mergeClipsBtn').onclick = mergeAndPreview;
    document.getElementById('exportBtn').onclick = exportHD;
    document.getElementById('saveProjectBtn').onclick = saveProject;
    document.getElementById('loadProjectBtn').onclick = loadProject;
    document.getElementById('applyTrimBtn').onclick = applyTrim;
    document.getElementById('splitClipBtn').onclick = splitClip;
    document.getElementById('volumeSlider').oninput = (e) => volume = parseFloat(e.target.value);
    document.getElementById('addMusicBtn').onclick = () => document.getElementById('musicInput').click();
    document.getElementById('musicInput').onchange = (e) => { if(e.target.files[0]) bgMusicFile = e.target.files[0]; alert('Music added'); };
    document.getElementById('removeAudioBtn').onclick = () => { removeOriginalAudio = !removeOriginalAudio; alert(removeOriginalAudio ? 'Original audio will be removed' : 'Original audio kept'); };
    document.querySelectorAll('[data-filter]').forEach(btn => {
        btn.onclick = () => { currentFilter = btn.dataset.filter; alert(`Filter: ${btn.innerText}`); };
    });
    document.querySelectorAll('[data-ratio]').forEach(btn => {
        btn.onclick = () => { currentAspect = btn.dataset.ratio; alert(`Aspect: ${btn.innerText}`); };
    });

    // Start everything
    init();
</script>
</body>
</html>
